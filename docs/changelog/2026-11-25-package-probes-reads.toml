date  = "2026-11-25"
type  = "change"
title = "hs smoke refuses package checks that are not declared as reads"
body  = """A check that a package adds to hs smoke now runs only when it is a command of that same package declared as reading, or a changing command that receives --dry-run as its last word. Any other check is skipped with a warning and counted as a failure. This catches mistakes in a package; it does not protect against a hostile one."""
