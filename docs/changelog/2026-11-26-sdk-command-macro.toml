date  = "2026-11-26"
type  = "feature"
title = "Rust SDK: write a command with #[command]; validate checks commands.tsv against the program"
body  = """For authors of Rust command extensions: with the feature macros of hobnix-pkg-command, a command is a function with #[command(name, reads or changes, help, help_de)] and its arguments a struct with #[derive(Args)]. commands! makes the dispatch and the commands.tsv rows from the same code, and the build puts the rows into the program. hs pkg validate reads them from the program file, without running it, and refuses a commands.tsv whose rows differ (binary.drift), and a damaged or second table (binary.table). The macro refuses control characters in help texts. An extension that writes its rows by hand is not affected and does not build the macros. docs/extensions-sdk.md "Write it in Rust" shows how."""
