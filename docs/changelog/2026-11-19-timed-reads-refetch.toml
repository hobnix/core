date  = "2026-11-19"
type  = "change"
title = "Detail panels of users, groups, shares, containers and nodes follow changes instead of asking again and again"
body  = """The details of a user, a group, a share, a container or a node are read again when the list they belong to changes, not on a timer. Fewer requests while the live connection is open; without it the old interval still applies."""
