date  = "2026-11-23"
type  = "fix"
title = "Extension services can use integration keys and roll-ups"
body  = """A confined extension service could not reach the server state, so it could not read the key of an integration or add to a monthly rollup. The core now starts the service in its own confined unit while the supervisor stays outside it: keys of the integrations a package declared reach the service as systemd credentials, and roll-ups of its declared metric events go through a new service message. Not tested on hardware yet."""
