date  = "2026-11-26"
type  = "change"
title = "Breaking rename: the Rust extension SDK hobnix-ext-sdk is now hobnix-pkg, hobnix-pkg-command and hobnix-pkg-service"
body  = """Breaking change for authors of Rust extensions, as announced in 0.13: the SDK crate hobnix-ext-sdk is split into hobnix-pkg (Ctx, Event, Secret, Error, the protocol messages, integrations, credentials, http), hobnix-pkg-command (the command runner) and hobnix-pkg-service (the service runner). hobnix-ext-sdk stays for this release only: it re-exports the new crates under the old paths, so an extension of 0.13 builds unchanged with a deprecation warning; it is removed in the next release. A crate that pins an older tag or rev keeps building against that one. The new crates change the API: a key is a Secret that prints as ***, Service::start and on_event return hobnix_pkg::Error instead of String, ctx.event is ctx.emit, and growable types are built with constructors. An unknown language or caller from a newer core is accepted. The protocol lines are byte for byte the same. docs/extensions-sdk.md "Write it in Rust" lists the steps to move."""
