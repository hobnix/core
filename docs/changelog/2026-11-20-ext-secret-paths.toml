date  = "2026-11-20"
type  = "security"
title = "Extensions can no longer read or be granted the server's secrets"
body  = """
A confined extension service now sees /var/lib/hs as an empty folder (only its own state is bound back), and /root, /etc/shadow, /etc/ssh and /etc/nixos are inaccessible to it. A package may keep state in /var/lib/hs/<its own name>. A package whose fs.read or fs.write permission overlaps these places, or whose fs.write points below /etc, /boot or /nix, is refused with the reason. The service still runs as root and the network is not limited. Not tested on hardware yet.
"""
