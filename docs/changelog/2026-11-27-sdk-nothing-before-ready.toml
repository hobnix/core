date  = "2026-11-27"
type  = "fix"
title = "Rust SDK: a service that writes while it starts no longer fails with protocol_error"
docs  = "extensions-sdk#write-it-in-rust"
body  = """For authors of Rust service extensions: a thread that start launched could write a log, event, snapshot or rollup before the service had sent ready. The core then failed the service with protocol_error, now and then. The SDK now holds such messages back and sends them after ready, in order. It holds at most 1000 messages and 4 MiB; further ones return an error and a warning after ready counts them. If start fails or panics, the held log lines go to stderr and nothing is sent. Rebuild the extension with the new SDK to get the fix. Not tested on hardware yet."""
