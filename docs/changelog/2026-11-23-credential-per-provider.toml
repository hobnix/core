date  = "2026-11-23"
type  = "change"
title = "Extension services get one key per app"
body  = """A confined extension service now gets one key file for each app that offers an integration it declared, named integration-<name>-<app> (for example integration-media-radarr), so a service that talks to jellyfin and radarr reads each key separately and always knows whose it is. The row of hs pkg integrations names its key: the package column is the app. The extension SDKs read it with credential(name, provider) in Python and credential_for(name, provider) in Rust. The old one-name form (the first app with a key) still works for one release and is deprecated."""
