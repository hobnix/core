date  = "2026-11-25"
type  = "change"
title = "Extension services no longer run as root"
body  = """Each extension service now runs as its own unprivileged user and may write only its own folder. At the first start its data moves once from /var/lib/hs/<name> to /var/lib/ext-hs/<name>; the old path stays as a link. If both folders already exist, the service does not start and nothing is changed. An extension that asks to write anywhere else does not start. Not tested on hardware yet."""
