name: package-index
on:
  workflow_call:
    inputs:
      repo_id:
        description: "the id written to the index (official, community, ...)"
        type: string
        required: true
      core_ref:
        description: "ref of hobnix/core that holds pkg.py and the trusted keys"
        type: string
        default: develop
      pages_url:
        description: "where the published index lives, to read the last serial (empty = the first index, serial 1)"
        type: string
        default: ""
    # No `secrets:` here: this workflow never sees the signing key (see the header).

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo
      - uses: actions/checkout@v5
        with:
          repository: hobnix/core
          ref: ${{ inputs.core_ref }}
          path: core
      - name: Install Pillow (asset resizing)
        run: python3 -m pip install --user pillow
      - name: Validate the repository
        run: python3 core/scripts/pkg.py repo-check repo
      - name: Build the index and the assets
        env:
          REPO_ID: ${{ inputs.repo_id }}
          PAGES_URL: ${{ inputs.pages_url }}
        run: |
          prev=()
          if [ -n "$PAGES_URL" ] && curl -fsS "$PAGES_URL/index.json" -o prev.json; then prev=(--prev prev.json); fi
          python3 core/scripts/pkg.py index build repo --repo "$REPO_ID" --out site "${prev[@]}"
          python3 core/scripts/pkg.py index validate site/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: site
          if-no-files-found: error
