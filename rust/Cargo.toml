[workspace]
resolver = "3"
members = ["hobnix-core", "hobnix-cli", "hobnix-ext-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
# The oldest rustc that must build these crates (cargo refuses an older one, clippy's incompatible_msrv flags newer std API): hobnix/official
# builds its extensions against the SDK with its own pinned toolchain (1.94.1, its rust-toolchain.toml; CI job ext-crates checks it). The
# toolchain of this workspace is newer (rust-toolchain.toml, the rustc of the nixpkgs pin). Raise this only together with official's pin.
rust-version = "1.94"

# Each version once; a crate writes `name = { workspace = true }` and may add features. serde_json's `preserve_order` is NOT set here:
# hobnix-core asks for it (its lines are byte-identical to the shell and python they replace, which keep insertion order), and cargo then
# turns it on for every crate of that build. The SDK's wire lines do not depend on it (proto.rs writes sorted keys; a test pins that).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hobnix-core = { path = "hobnix-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# A wrapping integer is a bug in release too (debug builds check anyway). panic stays "unwind": the SDK's runners catch a panicking handler.
[profile.release]
overflow-checks = true
panic = "unwind"
