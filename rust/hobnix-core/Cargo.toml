[package]
name = "hobnix-core"
description = "Service layer of the hobnix server (no terminal output, no argv parsing)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# pairing of remote shares (docs/PLAN-remote-shares.md D4): ChaCha20-Poly1305, HKDF-SHA256, SHA-256 of a host key; RustCrypto, pure Rust
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
