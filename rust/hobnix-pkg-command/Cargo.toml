[package]
name = "hobnix-pkg-command"
description = "Command runner of the Hobnix package SDK: the extension side of the command protocol (ADR 0010)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hobnix-pkg = { workspace = true }
serde_json = { workspace = true }
hobnix-pkg-macros = { workspace = true, optional = true }

[features]
# `#[command]`, `commands!` and `#[derive(Args)]`: the dispatch and the commands.tsv rows from the code (docs/PLAN-package-sdk.md)
macros = ["dep:hobnix-pkg-macros"]

[dev-dependencies]
trybuild = { workspace = true }
